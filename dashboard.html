<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMX500 Street Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e1014;
    --surface:   #16191f;
    --border:    rgba(255,255,255,0.08);
    --border-md: rgba(255,255,255,0.14);
    --text:      #e8eaf0;
    --muted:     #7a7e8a;
    --accent:    #4ade80;
    --accent2:   #60a5fa;
    --accent3:   #f59e0b;
    --pill-bg:   rgba(74,222,128,0.10);
    --pill-text: #4ade80;
    --radius:    8px;
    --radius-lg: 12px;
  }

  body {
    font-family: "DM Mono", "SF Mono", "Fira Code", monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
  }
  .logo {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  header h1 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .updated {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Stat bar ── */
  .stat-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 2rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }
  .stat-value.green  { color: var(--accent); }
  .stat-value.blue   { color: var(--accent2); }
  .stat-value.amber  { color: var(--accent3); }

  /* ── Day cards ── */
  .day-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.15s;
  }
  .day-header:hover {
    background: rgba(255,255,255,0.025);
  }
  .day-header.open {
    border-bottom-color: var(--border);
  }

  .day-date {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    min-width: 100px;
  }

  .day-bar-wrap {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .day-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .day-total {
    font-size: 13px;
    color: var(--text);
    min-width: 54px;
    text-align: right;
  }
  .day-total span {
    font-size: 10px;
    color: var(--muted);
    margin-left: 3px;
  }

  .chevron {
    width: 14px;
    height: 14px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .day-header.open .chevron {
    transform: rotate(180deg);
  }

  /* ── Label breakdown ── */
  .label-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    padding: 14px 18px;
  }
  .label-grid.visible {
    display: grid;
  }

  .label-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .label-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .label-name {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .label-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
  }

  /* ── Empty / error states ── */
  .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 0.4rem; font-size: 15px; }

  @media (max-width: 480px) {
    .day-bar-wrap { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">IMX500</span>
  <h1>Street Monitor</h1>
  <span class="updated" id="updated-at"></span>
</header>

<div class="stat-bar" id="stat-bar"></div>
<div class="day-list" id="day-list"></div>

<script>
const LABEL_COLORS = [
  "#4ade80","#60a5fa","#f59e0b","#f472b6",
  "#a78bfa","#34d399","#fb923c","#94a3b8",
];

function fmtDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function buildStats(days) {
  const totalEvents = days.reduce((s, d) => s + d.total, 0);
  const daysActive  = days.length;
  const allLabels   = new Set(days.flatMap(d => Object.keys(d.labels)));
  const busiest     = days.reduce((best, d) => d.total > best.total ? d : best, { total: 0, date: "—" });

  return [
    { label: "Total events",  value: totalEvents.toLocaleString(), cls: "green" },
    { label: "Days recorded", value: daysActive.toString(),         cls: "blue"  },
    { label: "Label types",   value: allLabels.size.toString(),     cls: "amber" },
    { label: "Busiest day",   value: busiest.date !== "—" ? fmtDate(busiest.date) : "—", cls: "" },
  ];
}

function renderStats(days) {
  const bar   = document.getElementById("stat-bar");
  const stats = buildStats(days);
  bar.innerHTML = stats.map(s => `
    <div class="stat">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value ${s.cls}">${s.value}</div>
    </div>
  `).join("");
}

function renderDays(days) {
  const list   = document.getElementById("day-list");
  const maxDay = Math.max(...days.map(d => d.total), 1);

  // Collect all unique labels across all days for stable color assignment
  const allLabels = [];
  days.forEach(d => Object.keys(d.labels).forEach(l => {
    if (!allLabels.includes(l)) allLabels.push(l);
  }));
  allLabels.sort();
  const colorFor = label => LABEL_COLORS[allLabels.indexOf(label) % LABEL_COLORS.length];

  list.innerHTML = days.map((day, i) => {
    const pct    = Math.round((day.total / maxDay) * 100);
    const labels = Object.entries(day.labels);

    const labelRows = labels.map(([name, count]) => `
      <div class="label-row">
        <div class="label-dot" style="background:${colorFor(name)}"></div>
        <span class="label-name">${name}</span>
        <span class="label-count">${count.toLocaleString()}</span>
      </div>
    `).join("");

    return `
      <div class="day-card">
        <div class="day-header" data-idx="${i}" onclick="toggleDay(this)">
          <div class="day-date">${fmtDate(day.date)}</div>
          <div class="day-bar-wrap">
            <div class="day-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="day-total">${day.total.toLocaleString()}<span>events</span></div>
          <svg class="chevron" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 5l4 4 4-4"/>
          </svg>
        </div>
        <div class="label-grid" id="labels-${i}">
          ${labelRows}
        </div>
      </div>
    `;
  }).join("");
}

function toggleDay(header) {
  const idx   = header.dataset.idx;
  const grid  = document.getElementById("labels-" + idx);
  const isOpen = header.classList.contains("open");
  header.classList.toggle("open", !isOpen);
  grid.classList.toggle("visible", !isOpen);
}

function showError(msg) {
  document.getElementById("day-list").innerHTML =
    `<div class="empty"><strong>No data available</strong>${msg}</div>`;
}

async function init() {
  try {
    const res = await fetch("summary.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const days = data.days || [];

    document.getElementById("updated-at").textContent =
      "updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

    if (!days.length) {
      showError("No events logged yet. Check back after the camera has been running.");
      return;
    }

    renderStats(days);
    renderDays(days);

  } catch (e) {
    showError("Could not load summary.json — make sure build_summary.py has been run.");
    console.error(e);
  }
}

init();
</script>
</body>
</html>
